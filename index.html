<script>
/* Mechanical keyboard click sounds (synthesised, no audio files needed) */
let audioCtx = null;
let noiseBuf = null;

function getNoise() {
    if (!noiseBuf) {
        const len = audioCtx.sampleRate; // 1 second of white noise, reused
        noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
    }
    return noiseBuf;
}

// short band-passed noise burst
function burst(t, freq, q, vol, dur) {
    const src = audioCtx.createBufferSource();
    const filter = audioCtx.createBiquadFilter();
    const gain = audioCtx.createGain();
    src.buffer = getNoise();
    filter.type = "bandpass";
    filter.frequency.value = freq;
    filter.Q.value = q;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t, Math.random() * 0.5);
    src.stop(t + dur + 0.01);
}

// low "thock" body of the keycap hitting the plate
function thock(t, freq, vol, dur) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq * 1.6, t);
    osc.frequency.exponentialRampToValueAtTime(freq, t + 0.03);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.01);
}

function playClick(pitch) {
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const t = audioCtx.currentTime;
        const v = 0.92 + Math.random() * 0.16;          // tiny random variation so it never sounds identical
        const tone = (0.9 + (pitch % 400) / 2000) * v;   // each tile gets a slightly different tone

        // 1) "click": the switch's sharp high-frequency tick
        burst(t, 4200 * tone, 1.2, 0.9, 0.018);
        burst(t, 2600 * tone, 0.9, 0.5, 0.025);

        // 2) "clack": keycap bottoming out, a few ms later
        burst(t + 0.012, 1400 * tone, 0.7, 0.6, 0.05);
        thock(t + 0.012, 170 * tone, 0.7, 0.07);

        // 3) release "tick" as the key comes back up
        burst(t + 0.075, 3200 * tone, 1.5, 0.25, 0.015);
    } catch (e) { /* audio not available, ignore */ }
}

document.querySelectorAll(".tile").forEach(tile => {
    tile.setAttribute("tabindex", "0");
    tile.setAttribute("role", "button");
    const note = parseFloat(tile.dataset.note);
    tile.addEventListener("click", () => playClick(note));
    tile.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playClick(note); }
    });
});
</script>
