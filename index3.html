<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Hunter: Arcade Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <span class="brand">GameShuffle</span>
        <span class="tag"><span class="tag-code">&lt;game&gt;</span><span class="tag-text">Ghost Hunter</span><span class="tag-code">&lt;/game&gt;</span></span>
    </header>

    <main class="stage">
        <section class="card game-box">
            <div class="card-head header">
                <span class="label">Score</span>
                <span id="score">0000</span>
            </div>
            <div class="board">
                <canvas id="gameCanvas" width="560" height="320"></canvas>

                <div id="status-overlay" class="overlay">
                    <div id="ready-content">
                        <h1 class="blink">READY!</h1>
                        <p>PRESS ANY ARROW KEY</p>
                    </div>
                    <div id="game-over-content" style="display: none;">
                        <h1 id="status-text" style="color: #ff6a13;">GAME OVER</h1>
                        <button class="btn" id="restart-btn">PLAY AGAIN</button>
                    </div>
                </div>
            </div>
            <div class="card-foot">
                <span class="label">Arrow keys to move &middot; power pellets turn the ghosts</span>
            </div>
        </section>
    </main>

    <nav class="bottombar">
        <a class="chip" href="index.html">Home</a>
        <a class="chip" href="index2.html">Snake</a>
        <a class="chip active" href="index3.html">Pac-Man</a>
        <div class="cta">Hit the arrow for a random game</div>
        <button class="arrow" onclick="goToRandomGame()" aria-label="Random game">&#8599;</button>
    </nav>
</div>

<script src="game.js"></script>
</body>
</html>
